<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPv6 地址</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 700px;
            width: 100%;
        }
        .label {
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #6b7280;
            margin-bottom: 12px;
        }
        .ip {
            font-size: 28px;
            font-weight: 600;
            font-family: "SF Mono", "Consolas", monospace;
            color: #0f172a;
            word-break: break-all;
            line-height: 1.5;
            min-height: 2.4em;
        }
        .loading {
            color: #9ca3af;
            font-weight: 400;
            font-size: 20px;
        }
        .error {
            color: #dc2626;
            font-weight: 400;
            font-size: 18px;
        }
        .footer {
            margin-top: 24px;
            font-size: 13px;
            color: #9ca3af;
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }
        .footer a {
            color: #2563eb;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="label">🌐 当前公网 IPv6 地址</div>
        <div id="ipDisplay" class="ip loading">正在获取…</div>
        
    </div>

    <script>
        const USER = "vic-qy";
        const REPO = "DDNS";
        const RAW_URL = `https://raw.githubusercontent.com/${USER}/${REPO}/main/ipv6.txt`;

        const ipDisplay = document.getElementById('ipDisplay');

        async function fetchIp() {
            try {
                const resp = await fetch(RAW_URL);
                if (!resp.ok) throw new Error('文件不存在');
                const ip = (await resp.text()).trim();
                if (ip && ip.includes(':')) {
                    ipDisplay.textContent = ip;
                    ipDisplay.className = 'ip';
                } else {
                    throw new Error('无效的 IPv6 格式');
                }
            } catch (err) {
                ipDisplay.textContent = '⚠️ 获取失败，请稍后重试';
                ipDisplay.className = 'ip error';
            }
        }

        fetchIp();
    </script>

</body>
</html>
